name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t portfolio:${{ github.sha }} --build-arg APP_VERSION=${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 8080:80 --name portfolio portfolio:${{ github.sha }}

      - name: Test the site
        run: |
          sleep 3
          curl -fsS http://localhost:8080 -o page.html
          grep "Nagulan" page.html
          grep "${{ github.sha }}" page.html
          ! grep "__APP_VERSION__" page.html

  push-to-ecr:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: portfolio
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --build-arg APP_VERSION=${{ github.sha }} .
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
